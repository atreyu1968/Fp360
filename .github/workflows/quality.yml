name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fp360_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fp360_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/fp360_test
      SESSION_SECRET: ci-only-test-session-secret-not-for-real-use
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck and build production artifacts
        run: pnpm run build
      - name: Create isolated test schema
        run: pnpm --filter @workspace/db run push
      - name: Test API routes
        run: pnpm run test:api
        env:
          NODE_ENV: test
      - name: Test database-backed workflows
        run: |
          set -euo pipefail
          PORT=8080 NODE_ENV=test node artifacts/api-server/dist/index.mjs &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true; wait "$api_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/api/healthz >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/api/healthz >/dev/null
          NODE_ENV=test pnpm run test:db-integration
