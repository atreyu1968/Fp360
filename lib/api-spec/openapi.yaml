        deliveryDays: { type: integer }
        paymentDays: { type: integer }
        freightCents: { type: integer }
        qualityScoreBasisPoints: { type: integer }
        validUntil: { type: ["string", "null"], format: date }
        baseCents: { type: integer }
        igicCents: { type: integer }
        totalCents: { type: integer }
        priceScoreBasisPoints: { type: integer }
        deliveryScoreBasisPoints: { type: integer }
