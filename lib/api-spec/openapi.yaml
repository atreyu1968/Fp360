openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: RED FP360 demo ERP — all monetary and institutional actions are simulated.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: redfp360
    description: RED FP360 simulated business operations
security:
  - sessionCookie: []
paths:
  /healthz:
    get:
      security: []
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/status:
    get:
      security: []
      operationId: getAuthStatus
      tags: [auth]
      summary: Check whether initial administrator setup is required
      responses:
        "200":
          description: Authentication setup status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatus"
  /auth/setup:
    post:
      security: []
      operationId: setupInitialAdministrator
      tags: [auth]
      summary: Create the first administrator using the setup token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthSetupInput"
      responses:
        "201":
          description: Initial administrator created and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthIdentity"
        "400":
          description: Invalid setup details
        "403":
          description: Invalid setup token
        "409":
          description: Administrator setup has already been completed
        "503":
          description: Initial setup is not enabled
  /auth/login:
    post:
      security: []
      operationId: login
      tags: [auth]
      summary: Sign in with an email address and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginInput"
      responses:
        "200":
          description: Signed in identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthIdentity"
        "401":
          description: Email or password is incorrect
        "429":
          description: Too many sign-in attempts
  /auth/me:
    get:
      operationId: getCurrentIdentity
      tags: [auth]
      summary: Get the signed-in user's current organization and role
      responses:
        "200":
          description: Current signed-in identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthIdentity"
        "401":
          description: Sign-in required
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current server-side session
      responses:
        "204":
          description: Session ended
        "401":
          description: Sign-in required
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [administration]
      responses:
        "200":
          description: Users in the administrator's network
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ManagedUser" }
        "403": { description: Administrator required }
  /admin/users/{id}:
    patch:
      operationId: updateAdminUser
      tags: [administration]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManagedUserUpdate" }
      responses:
        "200":
          description: Updated membership
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedUser" }
        "400": { description: Invalid changes }
        "403": { description: Administrator required }
        "404": { description: User not found in this network }
        "409": { description: Last administrator cannot be removed }
  /admin/invitations:
    get:
      operationId: listAdminInvitations
      tags: [administration]
      responses:
        "200":
          description: Invitations in this network
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UserInvitation" }
        "403": { description: Administrator required }
    post:
      operationId: createAdminInvitation
      tags: [administration]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserInvitationInput" }
      responses:
        "201":
          description: Invitation with token disclosed only once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssuedInvitation" }
        "400": { description: Invalid invitation }
        "403": { description: Administrator required }
        "409": { description: Account or pending invitation already exists }
  /admin/invitations/{id}:
    delete:
      operationId: revokeAdminInvitation
      tags: [administration]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Invitation revoked }
        "403": { description: Administrator required }
        "404": { description: Invitation not found }
        "409": { description: Invitation is no longer pending }
  /admin/audit:
    get:
      operationId: listAdminAudit
      tags: [administration]
      responses:
        "200":
          description: Recent access administration events in this network
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AccessAuditEvent" }
        "403": { description: Administrator required }
  /auth/invitations/inspect:
    post:
      security: []
      operationId: inspectInvitation
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvitationTokenInput" }
      responses:
        "200":
          description: Valid pending invitation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationPreview" }
        "400": { description: Invalid request }
        "410": { description: "Invitation invalid, expired or already used" }
    # Tokens belong in the request body, never in access-logged URL paths.
  /auth/invitations/accept:
    post:
      security: []
      operationId: acceptInvitation
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvitationAcceptanceInput" }
      responses:
        "201":
          description: Account created and signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthIdentity" }
        "400": { description: Invalid account details }
        "409": { description: Account already exists }
        "410": { description: "Invitation invalid, expired or already used" }
  /redfp360/dashboard:
    get:
      operationId: getFp360Dashboard
      tags: [redfp360]
      summary: Get the simulated company dashboard
      responses:
        "200":
          description: Dashboard totals and recent activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fp360Dashboard"
  /redfp360/organizations:
    get:
      operationId: listFp360Organizations
      tags: [redfp360]
      summary: List simulated market organizations
      responses:
        "200":
          description: Organizations in the demo network
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Fp360Organization"
    post:
      operationId: createFp360Organization
      tags: [redfp360]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Fp360OrganizationInput" }
      responses:
        "201":
          description: Simulated organization created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fp360Organization" }
        "400": { description: Invalid organization }
        "403": { description: Read-only role }
        "409": { description: Duplicate organization }
  /redfp360/organizations/{id}:
    patch:
      operationId: updateFp360Organization
      tags: [redfp360]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Fp360OrganizationUpdate" }
      responses:
        "200":
          description: Organization updated without deleting history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fp360Organization" }
        "400": { description: Invalid organization }
        "403": { description: Read-only role }
        "404": { description: Organization not found }
        "409": { description: Duplicate or assigned organization cannot be archived }
  /redfp360/products:
    get:
      operationId: listFp360Products
      tags: [redfp360]
      summary: List the simulated product catalog
      responses:
        "200":
          description: Products and available stock
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Fp360Product"
    post:
      operationId: createFp360Product
      tags: [redfp360]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Fp360ProductInput" }
      responses:
        "201":
          description: Unpublished product created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fp360Product" }
        "400": { description: Invalid product }
        "403": { description: Read-only role }
        "409": { description: Duplicate SKU }
  /redfp360/products/{id}:
    patch:
      operationId: updateFp360Product
      tags: [redfp360]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Fp360ProductUpdate" }
      responses:
        "200":
          description: Updated product; price or tax changes require republication
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fp360Product" }
        "400": { description: Invalid product }
        "403": { description: Publishing requires teacher or administrator }
        "404": { description: Product not found }
        "409": { description: Duplicate SKU or reserved stock prevents archiving }
  /redfp360/products/{id}/stock-adjustments:
    get:
      operationId: listFp360StockAdjustments
      tags: [redfp360]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Manual stock adjustments for this product
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Fp360StockAdjustment" }
        "404": { description: Product not found }
    post:
      operationId: adjustFp360Stock
      tags: [redfp360]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Fp360StockAdjustmentInput" }
      responses:
        "200":
          description: Stock adjusted atomically
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fp360Product" }
        "400": { description: Invalid adjustment }
        "403": { description: Read-only role }
        "404": { description: Product not found }
        "409": { description: Stock cannot fall below reserved units }
  /redfp360/orders:
    get:
      operationId: listFp360Orders
      tags: [redfp360]
      summary: List purchase and sales orders
      responses:
        "200":
          description: Orders in the demo company
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Fp360Order"
    post:
      operationId: createFp360Order
      tags: [redfp360]
      summary: Create a simulated draft order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Fp360OrderInput"
      responses:
        "201":
          description: Draft order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fp360Order"
        "400":
          description: Invalid order data or insufficient stock
  /redfp360/orders/{id}/confirm:
    post:
      operationId: confirmFp360Order
      tags: [redfp360]
      summary: Confirm an order and reserve its stock
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Confirmed order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fp360Order"
        "400":
          description: Order cannot be confirmed
        "404":
          description: Order not found
  /redfp360/orders/{id}/dispatch:
    post:
      operationId: dispatchFp360Order
      tags: [redfp360]
      summary: Record a full or partial simulated shipment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Fp360DispatchInput"
      responses:
        "200":
          description: Updated shipment and order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fp360Order"
        "400":
          description: Invalid or unavailable quantities
        "404":
          description: Order not found
  /redfp360/invoices:
    get:
      operationId: listFp360Invoices
      tags: [redfp360]
      summary: List issued simulated invoices
      responses:
        "200":
          description: Invoices and outstanding balances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Fp360Invoice"
    post:
      operationId: issueFp360Invoice
      tags: [redfp360]
      summary: Issue an immutable simulated invoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Fp360InvoiceInput"
      responses:
        "201":
          description: Issued invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fp360Invoice"
        "400":
          description: Order has no uninvoiced shipped quantities
        "404":
          description: Order not found
  /redfp360/invoices/{id}/payments:
    post:
      operationId: recordFp360Payment
      tags: [redfp360]
      summary: Record a simulated bank payment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Fp360PaymentInput"
      responses:
        "201":
          description: Simulated payment recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fp360Invoice"
        "400":
          description: Invalid payment amount
        "404":
          description: Invoice not found
  /redfp360/activity:
    get:
      operationId: listFp360Activity
      tags: [redfp360]
      summary: List recent simulated business activity
      responses:
        "200":
          description: Chronological audit activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Fp360Activity"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: redfp360_session
  schemas:
    Fp360OrganizationInput:
      type: object
      required: [name, center, island, role]
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        center: { type: string, minLength: 1, maxLength: 150 }
        island: { type: string, enum: [Tenerife, Gran Canaria, Lanzarote, Fuerteventura, La Palma, La Gomera, El Hierro, La Graciosa] }
        role: { type: string, enum: [seller, buyer, both] }
    Fp360OrganizationUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        center: { type: string, minLength: 1, maxLength: 150 }
        island: { type: string, enum: [Tenerife, Gran Canaria, Lanzarote, Fuerteventura, La Palma, La Gomera, El Hierro, La Graciosa] }
        role: { type: string, enum: [seller, buyer, both] }
        isActive: { type: boolean }
    Fp360ProductInput:
      type: object
      required: [sku, name, category, unitPriceCents, igicBasisPoints, stock]
      properties:
        sku: { type: string, minLength: 1, maxLength: 40, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$' }
        name: { type: string, minLength: 1, maxLength: 150 }
        category: { type: string, minLength: 1, maxLength: 100 }
        unitPriceCents: { type: integer, minimum: 0, maximum: 100000000 }
        costCents: { type: integer, minimum: 0, maximum: 100000000 }
        igicBasisPoints: { type: integer, minimum: 0, maximum: 10000 }
        stock: { type: integer, minimum: 0, maximum: 1000000 }
        minimumStock: { type: integer, minimum: 0, maximum: 1000000 }
    Fp360ProductUpdate:
      type: object
      properties:
        sku: { type: string, minLength: 1, maxLength: 40, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$' }
        name: { type: string, minLength: 1, maxLength: 150 }
        category: { type: string, minLength: 1, maxLength: 100 }
        unitPriceCents: { type: integer, minimum: 0, maximum: 100000000 }
        costCents: { type: integer, minimum: 0, maximum: 100000000 }
        igicBasisPoints: { type: integer, minimum: 0, maximum: 10000 }
        minimumStock: { type: integer, minimum: 0, maximum: 1000000 }
        isActive: { type: boolean }
        isPublished: { type: boolean }
    Fp360StockAdjustmentInput:
      type: object
      required: [operationId, quantityDelta, reason]
      properties:
        operationId: { type: string, format: uuid }
        quantityDelta: { type: integer, minimum: -1000000, maximum: 1000000 }
        reason: { type: string, minLength: 5, maxLength: 500 }
    Fp360StockAdjustment:
      type: object
      required: [id, quantityDelta, stockBefore, stockAfter, reason, actorName, simulatedDate, createdAt]
      properties:
        id: { type: string }
        quantityDelta: { type: integer }
        stockBefore: { type: integer }
        stockAfter: { type: integer }
        reason: { type: string }
        actorName: { type: string }
        simulatedDate: { type: string, format: date }
        createdAt: { type: string, format: date-time }
    AccessRole:
      type: string
      enum: [student, team_manager, teacher, promoter, mentor, administrator]
    ManagedUser:
      type: object
      required: [id, email, displayName, role, isActive, createdAt]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        displayName: { type: string }
        role: { $ref: "#/components/schemas/AccessRole" }
        organizationId: { type: ["string", "null"] }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
    ManagedUserUpdate:
      type: object
      properties:
        role: { $ref: "#/components/schemas/AccessRole" }
        isActive: { type: boolean }
        organizationId: { type: ["string", "null"], minLength: 1 }
    UserInvitationInput:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        role: { $ref: "#/components/schemas/AccessRole" }
        organizationId: { type: ["string", "null"], minLength: 1 }
    UserInvitation:
      type: object
      required: [id, email, role, status, expiresAt, createdAt]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/AccessRole" }
        organizationId: { type: ["string", "null"] }
        status: { type: string, enum: [pending, accepted, revoked, expired] }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    IssuedInvitation:
      type: object
      required: [invitation, token]
      properties:
        invitation: { $ref: "#/components/schemas/UserInvitation" }
        token: { type: string }
    InvitationTokenInput:
      type: object
      required: [token]
      properties:
        token: { type: string, minLength: 32, maxLength: 128 }
    InvitationPreview:
      type: object
      required: [email, role, expiresAt]
      properties:
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/AccessRole" }
        expiresAt: { type: string, format: date-time }
    InvitationAcceptanceInput:
      type: object
      required: [token, displayName, password]
      properties:
        token: { type: string, minLength: 32, maxLength: 128 }
        displayName: { type: string, minLength: 1, maxLength: 100 }
        password: { type: string, minLength: 12, maxLength: 128 }
    AccessAuditEvent:
      type: object
      required: [id, action, entityId, createdAt]
      properties:
        id: { type: string }
        action: { type: string }
        entityId: { type: string }
        actorUserId: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    AuthStatus:
      type: object
      required: [setupRequired]
      properties:
        setupRequired: { type: boolean }
    AuthSetupInput:
      type: object
      required: [email, displayName, password, setupToken]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        displayName: { type: string, minLength: 1, maxLength: 100 }
        password: { type: string, minLength: 12, maxLength: 128 }
        setupToken: { type: string, minLength: 32, maxLength: 256 }
    AuthLoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 128 }
        tenantId: { type: string, minLength: 1, maxLength: 100 }
    AuthIdentity:
      type: object
      required: [id, email, displayName, tenantId, role]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        displayName: { type: string }
        tenantId: { type: string }
        organizationId: { type: string }
        role:
          type: string
          enum: [student, team_manager, teacher, promoter, mentor, administrator]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Fp360Organization:
      type: object
      required: [id, name, center, island, role, isActive]
      properties:
        id: { type: string }
        name: { type: string }
        center: { type: string }
        island: { type: string }
        role: { type: string, enum: [seller, buyer, both] }
        isActive: { type: boolean }
    Fp360Product:
      type: object
      required: [id, sku, name, category, unitPriceCents, igicBasisPoints, stock, reserved, costCents, minimumStock, isActive, isPublished]
      properties:
        id: { type: string }
        sku: { type: string }
        name: { type: string }
        category: { type: string }
        unitPriceCents: { type: integer, minimum: 0 }
        igicBasisPoints: { type: integer, minimum: 0 }
        stock: { type: integer, minimum: 0 }
        reserved: { type: integer, minimum: 0 }
        costCents: { type: integer, minimum: 0 }
        minimumStock: { type: integer, minimum: 0 }
        isActive: { type: boolean }
        isPublished: { type: boolean }
    Fp360OrderLine:
      type: object
      required: [productId, productName, quantity, shippedQuantity, invoicedQuantity, unitPriceCents]
      properties:
        productId: { type: string }
        productName: { type: string }
        quantity: { type: integer, minimum: 1 }
        shippedQuantity: { type: integer, minimum: 0 }
        invoicedQuantity: { type: integer, minimum: 0 }
        unitPriceCents: { type: integer, minimum: 0 }
    Fp360Order:
      type: object
      required: [id, reference, buyerOrganizationId, buyerName, status, lines, totalCents, simulatedDate, createdAt]
      properties:
        id: { type: string }
        reference: { type: string }
        buyerOrganizationId: { type: string }
        buyerName: { type: string }
        status:
          type: string
          enum: [draft, confirmed, partial, delivered, invoiced, paid]
        lines:
          type: array
          items:
            $ref: "#/components/schemas/Fp360OrderLine"
        totalCents: { type: integer, minimum: 0 }
        simulatedDate: { type: string, format: date }
        createdAt: { type: string, format: date-time }
    Fp360OrderLineInput:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: string, minLength: 1 }
        quantity: { type: integer, minimum: 1, maximum: 999 }
    Fp360OrderInput:
      type: object
      required: [buyerOrganizationId, lines]
      properties:
        buyerOrganizationId: { type: string, minLength: 1 }
        lines:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Fp360OrderLineInput"
    Fp360DispatchLine:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: string, minLength: 1 }
        quantity: { type: integer, minimum: 1, maximum: 999 }
    Fp360DispatchInput:
      type: object
      required: [lines]
      properties:
        lines:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Fp360DispatchLine"
    Fp360InvoiceLine:
      type: object
