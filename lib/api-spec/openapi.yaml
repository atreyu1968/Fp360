        department: { type: string }
        urgency: { $ref: "#/components/schemas/PurchaseUrgency" }
        deadline: { type: ["string", "null"], format: date }
        budgetCapCents: { type: integer }
        status: { $ref: "#/components/schemas/PurchaseRequestStatus" }
        lineCount: { type: integer }
        offerCount: { type: integer }
        updatedAt: { type: string, format: date-time }
    PurchaseRequest:
      type: object
      required: [id, requestNumber, organizationId, organizationName, department, urgency, deadline, budgetCapCents, purpose, status, lineCount, offerCount, requestedSuppliers, lines, createdByRole, decisionReason, awardedReason, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        requestNumber: { type: string }
        organizationId: { type: string, format: uuid }
        organizationName: { type: string }
        department: { type: string }
        urgency: { $ref: "#/components/schemas/PurchaseUrgency" }
        deadline: { type: ["string", "null"], format: date }
        budgetCapCents: { type: integer }
        purpose: { type: string }
        status: { $ref: "#/components/schemas/PurchaseRequestStatus" }
        lineCount: { type: integer }
        offerCount: { type: integer }
        requestedSuppliers:
          type: array
