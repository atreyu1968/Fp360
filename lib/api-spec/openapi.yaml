openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: RED FP360 demo ERP — all monetary and institutional actions are simulated.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: redfp360
    description: RED FP360 simulated business operations
security:
  - sessionCookie: []
paths:
  /healthz:
    get:
      security: []
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/status:
    get:
      security: []
      operationId: getAuthStatus
      tags: [auth]
      summary: Check whether initial administrator setup is required
      responses:
        "200":
          description: Authentication setup status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatus"
  /auth/setup:
    post:
      security: []
      operationId: setupInitialAdministrator
      tags: [auth]
      summary: Create the first administrator using the setup token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthSetupInput"
      responses:
        "201":
          description: Initial administrator created and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthIdentity"
        "400":
          description: Invalid setup details
        "403":
          description: Invalid setup token
        "409":
          description: Administrator setup has already been completed
        "503":
          description: Initial setup is not enabled
  /auth/login:
    post:
      security: []
      operationId: login
      tags: [auth]
      summary: Sign in with an email address and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginInput"
      responses:
        "200":
          description: Signed in identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthIdentity"
        "401":
          description: Email or password is incorrect
        "429":
          description: Too many sign-in attempts
  /auth/me:
    get:
      operationId: getCurrentIdentity
      tags: [auth]
      summary: Get the signed-in user's current organization and role
      responses:
        "200":
          description: Current signed-in identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthIdentity"
        "401":
          description: Sign-in required
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current server-side session
      responses:
        "204":
          description: Session ended
        "401":
          description: Sign-in required
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [administration]
      responses:
        "200":
          description: Users in the administrator's network
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ManagedUser" }
        "403": { description: Administrator required }
  /admin/users/{id}:
    patch:
      operationId: updateAdminUser
      tags: [administration]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManagedUserUpdate" }
      responses:
        "200":
          description: Updated membership
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedUser" }
        "400": { description: Invalid changes }
        "403": { description: Administrator required }
        "404": { description: User not found in this network }
        "409": { description: Last administrator cannot be removed }
  /admin/invitations:
    get:
      operationId: listAdminInvitations
      tags: [administration]
      responses:
        "200":
          description: Invitations in this network
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UserInvitation" }
        "403": { description: Administrator required }
    post:
      operationId: createAdminInvitation
      tags: [administration]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserInvitationInput" }
      responses:
        "201":
          description: Invitation with token disclosed only once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssuedInvitation" }
        "400": { description: Invalid invitation }
        "403": { description: Administrator required }
        "409": { description: Account or pending invitation already exists }
  /admin/invitations/{id}:
    delete:
      operationId: revokeAdminInvitation
      tags: [administration]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Invitation revoked }
        "403": { description: Administrator required }
        "404": { description: Invitation not found }
        "409": { description: Invitation is no longer pending }
  /admin/audit:
    get:
      operationId: listAdminAudit
      tags: [administration]
      responses:
        "200":
          description: Recent access administration events in this network
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AccessAuditEvent" }
        "403": { description: Administrator required }
  /auth/invitations/inspect:
    post:
      security: []
      operationId: inspectInvitation
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvitationTokenInput" }
      responses:
        "200":
          description: Valid pending invitation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationPreview" }
        "400": { description: Invalid request }
        "410": { description: "Invitation invalid, expired or already used" }
    # Tokens belong in the request body, never in access-logged URL paths.
  /auth/invitations/accept:
    post:
      security: []
      operationId: acceptInvitation
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvitationAcceptanceInput" }
      responses:
        "201":
          description: Account created and signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthIdentity" }
        "400": { description: Invalid account details }
        "409": { description: Account already exists }
        "410": { description: "Invitation invalid, expired or already used" }
  /redfp360/dashboard:
    get:
      operationId: getFp360Dashboard
      tags: [redfp360]
      summary: Get the simulated company dashboard
      responses:
        "200":
          description: Dashboard totals and recent activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fp360Dashboard"
  /redfp360/simulations/overview:
    get:
      operationId: getFp360SimulationsOverview
      tags: [redfp360]
      summary: List campaigns and scenario events visible to the actor
      responses:
        "200":
          description: Campaigns, events, and active organizations available for the simulation workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fp360SimulationsOverview" }
  /redfp360/simulations/campaigns:
    post:
      operationId: createFp360SimulationCampaign
      tags: [redfp360]
      summary: Create a draft educational campaign
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Fp360SimulationCampaignInput" }
      responses:
        "201":
          description: Draft campaign
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fp360SimulationCampaign" }
        "400": { description: Invalid campaign data }
  /redfp360/simulations/campaigns/{id}/action:
    post:
      operationId: actOnFp360SimulationCampaign
      tags: [redfp360]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Fp360SimulationCampaignAction" }
      responses:
        "200":
          description: Updated campaign state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fp360SimulationCampaign" }
        "400": { description: Invalid campaign transition }
  /redfp360/simulations/campaigns/{id}/events:
    post:
      operationId: createFp360SimulationEvent
      tags: [redfp360]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Fp360SimulationEventInput" }
      responses:
        "201":
          description: Draft scenario event
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fp360SimulationEvent" }
        "400": { description: Invalid scenario event }
  /redfp360/simulations/events/{id}/action:
    post:
      operationId: actOnFp360SimulationEvent
      tags: [redfp360]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Fp360SimulationEventAction" }
      responses:
        "200":
          description: Updated event state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fp360SimulationEvent" }
        "400": { description: Invalid event transition }
  /redfp360/direction/overview:
    get:
      operationId: getFp360DirectionOverview
      tags: [redfp360]
      summary: Get source-backed executive indicators for a simulated period
      parameters:
        - in: query
          name: periodStart
          schema: { type: string, format: date }
        - in: query
          name: periodEnd
          schema: { type: string, format: date }
      responses:
        "200":
          description: Indicators with explicit source availability
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectionOverview" }
        "400": { description: Invalid period }
  /redfp360/direction/tasks:
    get:
      operationId: listFp360DirectionTasks
      tags: [redfp360]
      summary: List direction tasks for the authenticated tenant
      responses:
        "200":
          description: Tenant-scoped direction tasks
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DirectionTask" }
    post:
      operationId: createFp360DirectionTask
      tags: [redfp360]
      summary: Create a simulated direction task
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DirectionTaskInput" }
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectionTask" }
        "400": { description: Invalid task }
        "403": { description: Role cannot create tasks }
  /redfp360/direction/members:
    get:
      operationId: listFp360DirectionMembers
      tags: [redfp360]
      summary: List assignable active members in the authenticated tenant
      responses:
        "200":
          description: Active tenant members without private contact details
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DirectionMember" }
  /redfp360/direction/tasks/{id}:
    patch:
      operationId: updateFp360DirectionTask
      tags: [redfp360]
      summary: Update a task status with an audit reason
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DirectionTaskUpdate" }
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectionTask" }
        "400": { description: Invalid task update }
        "403": { description: Role cannot update this task }
        "404": { description: Task not found in tenant }
  /redfp360/direction/alerts:
    get:
      operationId: listFp360DirectionAlerts
      tags: [redfp360]
      summary: List source-derived alerts and their recorded actions
      responses:
        "200":
          description: Current alerts for the authenticated tenant
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DirectionAlert" }
  /redfp360/direction/alerts/{alertKey}:
    patch:
      operationId: updateFp360DirectionAlert
      tags: [redfp360]
      summary: Record an alert owner, status, justification, and evidence
      parameters:
        - in: path
          name: alertKey
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DirectionAlertAction" }
      responses:
        "200":
          description: Updated alert action
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectionAlert" }
        "400": { description: Invalid alert action or missing required evidence }
        "403": { description: Role cannot update alerts }
        "404": { description: Alert source not found in tenant }
  /redfp360/direction/thresholds:
    get:
      operationId: listFp360DirectionThresholds
      tags: [redfp360]
      summary: List configurable direction alert thresholds
      responses:
        "200":
          description: Tenant-scoped thresholds and configuration state
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DirectionThreshold" }
    put:
      operationId: upsertFp360DirectionThreshold
      tags: [redfp360]
      summary: Configure a source-aware direction alert threshold
      parameters:
        - in: query
          name: key
          required: true
          schema: { type: string, enum: [stock_low_units, liquidity_min_cents] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DirectionThresholdInput" }
      responses:
        "200":
          description: Updated threshold
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectionThreshold" }
        "400": { description: Invalid threshold }
        "403": { description: Role cannot configure thresholds }
  /redfp360/direction/decisions:
    get:
      operationId: listFp360DirectionDecisions
      tags: [redfp360]
      summary: List decisions and their retained approval history
      responses:
        "200":
          description: Tenant-scoped decisions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DirectionDecision" }
    post:
      operationId: createFp360DirectionDecision
      tags: [redfp360]
      summary: Submit a simulated management decision for review
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DirectionDecisionInput" }
      responses:
        "201":
          description: Decision submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectionDecision" }
        "400": { description: Invalid decision }
        "403": { description: Role cannot submit decisions }
  /redfp360/direction/decisions/{id}/decision:
    post:
      operationId: decideFp360DirectionDecision
      tags: [redfp360]
      summary: Approve or reject a decision with a retained reason
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DirectionDecisionReview" }
      responses:
        "200":
          description: Decision review recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectionDecision" }
        "400": { description: Invalid review or decision state }
        "403": { description: Only authorized supervisors can approve decisions }
        "404": { description: Decision not found in tenant }
  /redfp360/direction/objectives:
    get:
      operationId: listFp360DirectionObjectives
      tags: [redfp360]
      summary: List tenant objectives for the selected periods
      parameters:
        - in: query
          name: periodStart
          schema: { type: string, format: date }
        - in: query
          name: periodEnd
          schema: { type: string, format: date }
      responses:
        "200":
          description: Objectives and source-backed progress values
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DirectionObjective" }
    post:
      operationId: createFp360DirectionObjective
      tags: [redfp360]
      summary: Set a simulated company objective
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DirectionObjectiveInput" }
      responses:
        "201":
          description: Objective created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectionObjective" }
        "400": { description: Invalid objective period or target }
        "403": { description: Role cannot set objectives }
  /redfp360/direction/objectives/{id}:
    patch:
      operationId: updateFp360DirectionObjective
      tags: [redfp360]
      summary: Update a simulated company objective
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DirectionObjectiveInput" }
      responses:
        "200":
          description: Updated objective
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectionObjective" }
        "400": { description: Invalid objective }
        "403": { description: Role cannot update objectives }
        "404": { description: Objective not found in tenant }
  /redfp360/direction/reports:
    get:
      operationId: listFp360DirectionReports
      tags: [redfp360]
      summary: List direction reports visible to the authenticated role
      responses:
        "200":
          description: Saved reports filtered for the current role
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DirectionReport" }
    post:
      operationId: createFp360DirectionReport
      tags: [redfp360]
      summary: Save a source-backed report snapshot for a period
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DirectionReportInput" }
      responses:
        "201":
          description: Saved report snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectionReport" }
        "400": { description: Invalid report period }
        "403": { description: Role cannot save reports }
  /redfp360/direction/reports/{id}:
    get:
      operationId: getFp360DirectionReport
      tags: [redfp360]
      summary: Get a saved report visible to the authenticated role
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Saved report snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectionReport" }
        "403": { description: Report not visible to this role }
        "404": { description: Report not found in tenant }
  /redfp360/direction/events:
    get:
      operationId: listFp360DirectionEvents
      tags: [redfp360]
      summary: Read the retained direction audit trail
      parameters:
        - in: query
          name: entityType
          schema: { type: string, enum: [task, alert, decision, objective, report] }
        - in: query
          name: entityId
          schema: { type: string }
      responses:
        "200":
          description: Tenant-scoped audit events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DirectionEvent" }
  /redfp360/organizations:
    get:
      operationId: listFp360Organizations
      tags: [redfp360]
      summary: List simulated market organizations
      responses:
        "200":
          description: Organizations in the demo network
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Fp360Organization"
    post:
      operationId: createFp360Organization
      tags: [redfp360]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Fp360OrganizationInput" }
      responses:
        "201":
          description: Simulated organization created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fp360Organization" }
        "400": { description: Invalid organization }
        "403": { description: Read-only role }
        "409": { description: Duplicate organization }
  /redfp360/organizations/{id}:
    patch:
      operationId: updateFp360Organization
      tags: [redfp360]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Fp360OrganizationUpdate" }
      responses:
        "200":
          description: Organization updated without deleting history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fp360Organization" }
        "400": { description: Invalid organization }
        "403": { description: Read-only role }
        "404": { description: Organization not found }
        "409": { description: Duplicate or assigned organization cannot be archived }
  /redfp360/products:
    get:
      operationId: listFp360Products
      tags: [redfp360]
      summary: List the simulated product catalog
      responses:
        "200":
          description: Products and available stock
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Fp360Product"
    post:
      operationId: createFp360Product
      tags: [redfp360]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Fp360ProductInput" }
      responses:
        "201":
          description: Unpublished product created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fp360Product" }
        "400": { description: Invalid product }
        "403": { description: Read-only role }
        "409": { description: Duplicate SKU }
  /redfp360/products/{id}:
    patch:
      operationId: updateFp360Product
      tags: [redfp360]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Fp360ProductUpdate" }
      responses:
        "200":
          description: Updated product; price or tax changes require republication
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fp360Product" }
        "400": { description: Invalid product }
        "403": { description: Publishing requires teacher or administrator }
        "404": { description: Product not found }
        "409": { description: Duplicate SKU or reserved stock prevents archiving }
  /redfp360/products/{id}/price-versions:
    get:
      operationId: listFp360ProductPriceVersions
      tags: [redfp360]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Versioned prices and conditions for the catalog item
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Fp360ProductPriceVersion" }
        "404": { description: Product not found }
  /redfp360/products/{id}/documents:
    get:
      operationId: listFp360ProductDocuments
      tags: [redfp360]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Product and service documents in the current tenant
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Fp360ProductDocument" }
        "404": { description: Product not found }
  /redfp360/products/{id}/documents/upload-url:
    post:
      operationId: requestFp360ProductDocumentUploadUrl
      tags: [redfp360]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Fp360ProductDocumentUploadUrlInput" }
      responses:
        "200":
          description: Private upload URL and pending document record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fp360ProductDocumentUploadUrl" }
        "400": { description: Invalid file metadata or unsupported document }
        "403": { description: Read-only role }
        "404": { description: Product not found }
  /redfp360/products/{id}/documents/{documentId}/complete:
    post:
      operationId: completeFp360ProductDocumentUpload
      tags: [redfp360]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: documentId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Uploaded document verified and made available
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fp360ProductDocument" }
        "403": { description: Read-only role }
        "404": { description: "Product, document, or uploaded object not found" }
        "409": { description: Document upload is no longer pending }
  /redfp360/products/{id}/documents/{documentId}/download:
