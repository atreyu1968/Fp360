      properties:
        operationId: { type: string, format: uuid }
        supplierOrganizationId: { type: string, format: uuid }
        quoteReference: { type: string, minLength: 1, maxLength: 80 }
        deliveryDays: { type: integer, minimum: 1, maximum: 365 }
        paymentDays: { type: integer, minimum: 0, maximum: 365 }
        freightCents: { type: integer, minimum: 0, maximum: 100000000 }
        qualityScoreBasisPoints: { type: integer, minimum: 0, maximum: 10000 }
        validUntil: { type: ["string", "null"], format: date }
        lines:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: "#/components/schemas/PurchaseOfferLineInput" }
    PurchaseOfferLineInput:
      type: object
      required: [requestLineId, unitPriceCents, igicBasisPoints]
      properties:
        requestLineId: { type: string, format: uuid }
        unitPriceCents: { type: integer, minimum: 0, maximum: 100000000 }
        igicBasisPoints: { type: integer, minimum: 0, maximum: 10000 }
    PurchaseOfferLine:
      type: object
      required: [requestLineId, sku, productName, quantity, unitPriceCents, igicBasisPoints, baseCents, igicCents]
      properties:
        requestLineId: { type: string, format: uuid }
        sku: { type: string }
        productName: { type: string }
        quantity: { type: integer }
        unitPriceCents: { type: integer }
        igicBasisPoints: { type: integer }
        baseCents: { type: integer }
        igicCents: { type: integer }
    PurchaseOffer:
      type: object
      required: [id, requestId, supplierOrganizationId, supplierName, quoteReference, deliveryDays, paymentDays, freightCents, qualityScoreBasisPoints, validUntil, baseCents, igicCents, totalCents, priceScoreBasisPoints, deliveryScoreBasisPoints, termsScoreBasisPoints, weightedScoreBasisPoints, lines, createdByRole, createdAt]
      properties:
        id: { type: string, format: uuid }
        requestId: { type: string, format: uuid }
        supplierOrganizationId: { type: string, format: uuid }
        supplierName: { type: string }
        quoteReference: { type: string }
        deliveryDays: { type: integer }
        paymentDays: { type: integer }
        freightCents: { type: integer }
        qualityScoreBasisPoints: { type: integer }
        validUntil: { type: ["string", "null"], format: date }
        baseCents: { type: integer }
        igicCents: { type: integer }
        totalCents: { type: integer }
        priceScoreBasisPoints: { type: integer }
        deliveryScoreBasisPoints: { type: integer }
        termsScoreBasisPoints: { type: integer }
        weightedScoreBasisPoints: { type: integer }
        lines:
          type: array
          items: { $ref: "#/components/schemas/PurchaseOfferLine" }
        createdByRole: { type: string }
        createdAt: { type: string, format: date-time }
    PurchaseEvent:
      type: object
      required: [id, requestId, action, fromStatus, toStatus, reason, actorRole, simulatedDate, createdAt]
      properties:
        id: { type: string, format: uuid }
        requestId: { type: string, format: uuid }
        action: { type: string }
        fromStatus: { type: ["string", "null"] }
        toStatus: { $ref: "#/components/schemas/PurchaseEventStatus" }
        reason: { type: string }
        actorRole: { type: string }
        simulatedDate: { type: string, format: date }
        createdAt: { type: string, format: date-time }
    PurchaseOrderLine:
      type: object
      required: [id, productId, sku, productName, quantity, unitPriceCents, igicBasisPoints, baseCents, igicCents]
      properties:
        id: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        sku: { type: string }
        productName: { type: string }
        quantity: { type: integer }
        unitPriceCents: { type: integer }
        igicBasisPoints: { type: integer }
        baseCents: { type: integer }
        igicCents: { type: integer }
    PurchaseOrder:
      type: object
      required: [id, orderNumber, requestId, requestNumber, buyerOrganizationId, buyerOrganizationName, supplierOrganizationId, supplierName, offerId, baseCents, igicCents, freightCents, totalCents, status, expectedDate, receivedDate, awardedReason, simulatedDate, lines, createdAt]
      properties:
        id: { type: string, format: uuid }
        orderNumber: { type: string }
        requestId: { type: string, format: uuid }
        requestNumber: { type: string }
        buyerOrganizationId: { type: string, format: uuid }
        buyerOrganizationName: { type: string }
        supplierOrganizationId: { type: string, format: uuid }
        supplierName: { type: string }
        offerId: { type: string, format: uuid }
        baseCents: { type: integer }
        igicCents: { type: integer }
        freightCents: { type: integer }
        totalCents: { type: integer }
        status: { $ref: "#/components/schemas/PurchaseOrderStatus" }
        expectedDate: { type: ["string", "null"], format: date }
        receivedDate: { type: ["string", "null"], format: date }
        awardedReason: { type: string }
        simulatedDate: { type: string, format: date }
        lines:
          type: array
          items: { $ref: "#/components/schemas/PurchaseOrderLine" }
        createdAt: { type: string, format: date-time }
    PurchaseReceiptLineInput:
      type: object
      required: [purchaseOrderLineId, quantityAccepted, quantityRejected, issueReason]
      properties:
        purchaseOrderLineId: { type: string, format: uuid }
        quantityAccepted: { type: integer, minimum: 0, maximum: 1000000 }
        quantityRejected: { type: integer, minimum: 0, maximum: 1000000 }
        issueReason: { type: ["string", "null"], maxLength: 500 }
    PurchaseReceiptInput:
      type: object
      required: [operationId, receiptReference, receivedDate, lines]
      properties:
        operationId: { type: string, format: uuid }
        receiptReference: { type: string, minLength: 1, maxLength: 80 }
        receivedDate: { type: string, format: date }
        lines:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: "#/components/schemas/PurchaseReceiptLineInput" }
    PurchaseReceiptLine:
      type: object
      required: [purchaseOrderLineId, sku, productName, quantityOrdered, quantityAccepted, quantityRejected, issueReason]
      properties:
        purchaseOrderLineId: { type: string, format: uuid }
        sku: { type: string }
        productName: { type: string }
        quantityOrdered: { type: integer }
        quantityAccepted: { type: integer }
        quantityRejected: { type: integer }
        issueReason: { type: ["string", "null"] }
