            $ref: "#/components/schemas/Fp360InvoiceLine"
        baseCents: { type: integer, minimum: 0 }
        igicCents: { type: integer, minimum: 0 }
        totalCents: { type: integer, minimum: 0 }
        paidCents: { type: integer, minimum: 0 }
        balanceCents: { type: integer, minimum: 0 }
        simulatedDate: { type: string, format: date }
        createdAt: { type: string, format: date-time }
        payments:
          type: array
          items:
            $ref: "#/components/schemas/Fp360Payment"
    Fp360InvoiceInput:
      type: object
      required: [orderId]
      properties:
        orderId: { type: string, minLength: 1 }
    Fp360PaymentInput:
      type: object
      required: [amountCents]
      properties:
        amountCents: { type: integer, minimum: 1 }
    Fp360Activity:
      type: object
