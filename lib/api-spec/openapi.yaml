        quantity: { type: integer, minimum: 1 }
        unitPriceCents: { type: integer, minimum: 0 }
        baseCents: { type: integer, minimum: 0 }
        igicBasisPoints: { type: integer, minimum: 0 }
        igicCents: { type: integer, minimum: 0 }
        totalCents: { type: integer, minimum: 0 }
    Fp360Payment:
      type: object
      required: [id, amountCents, simulatedDate, createdAt]
      properties:
        id: { type: string }
        amountCents: { type: integer, minimum: 1 }
        simulatedDate: { type: string, format: date }
        createdAt: { type: string, format: date-time }
    Fp360Invoice:
      type: object
      required: [id, reference, orderId, buyerName, status, lines, baseCents, igicCents, totalCents, paidCents, balanceCents, simulatedDate, createdAt, payments]
      properties:
        id: { type: string }
        reference: { type: string }
