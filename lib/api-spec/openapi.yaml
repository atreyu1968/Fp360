      summary: Create a simulated document dossier
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Fp360DocumentDossierInput" }
      responses:
        "201":
          description: Dossier created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fp360DocumentDossier" }
        "401":
          description: Authentication required
  /redfp360/documents:
    post:
      operationId: createFp360Document
      tags: [redfp360]
      summary: Create a simulated document record
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Fp360DocumentInput" }
      responses:
        "201":
          description: Document draft created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fp360Document" }
        "401":
          description: Authentication required
  /redfp360/documents/{documentId}:
    patch:
      operationId: updateFp360Document
      tags: [redfp360]
      summary: Update metadata on an editable document
      parameters:
        - in: path
          name: documentId
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Fp360DocumentUpdateInput" }
      responses:
        "200":
          description: Updated document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fp360Document" }
        "401":
          description: Authentication required
  /redfp360/documents/{documentId}/access-log:
    post:
      operationId: logFp360DocumentAccess
      tags: [redfp360]
      summary: Record an authenticated document detail view
      parameters:
        - in: path
          name: documentId
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "201":
          description: Access recorded
          content:
            application/json:
              schema:
                type: object
                required: [recorded]
                properties:
                  recorded: { type: boolean }
        "401":
          description: Authentication required
        "404":
          description: Document not found
  /redfp360/documents/dossiers/{dossierId}/actions:
    post:
      operationId: actOnFp360DocumentDossier
      tags: [redfp360]
      summary: Archive or reopen a dossier with its audit history preserved
      parameters:
        - in: path
          name: dossierId
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Fp360DocumentDossierActionInput" }
      responses:
        "200":
          description: Updated dossier
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fp360DocumentDossier" }
        "401":
          description: Authentication required
  /redfp360/documents/dossiers/{dossierId}/package:
    get:
      operationId: downloadFp360DocumentDossierPackage
      tags: [redfp360]
      summary: Download an authenticated educational dossier package
      parameters:
        - in: path
          name: dossierId
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: ZIP containing a manifest and verified document versions
          content:
            application/zip:
              schema: { type: string, format: binary }
        "401":
          description: Authentication required
        "403":
          description: Reviewer access required
        "404":
          description: Dossier not found
        "409":
          description: Package cannot be generated
        "413":
          description: Package exceeds the size or version limit
  /redfp360/documents/templates/{templateKey}/generate:
    post:
      operationId: generateFp360DocumentFromTemplate
      tags: [redfp360]
      summary: Generate a clearly marked educational document from a template
      parameters:
        - in: path
          name: templateKey
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Fp360DocumentTemplateInput" }
      responses:
        "201":
          description: Educational document created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fp360Document" }
        "401":
          description: Authentication required
  /redfp360/documents/{documentId}/versions/upload-url:
    post:
      operationId: requestFp360DocumentUploadUrl
      tags: [redfp360]
      summary: Create a new immutable document version and private upload URL
      parameters:
        - in: path
          name: documentId
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Fp360DocumentUploadInput" }
      responses:
        "201":
          description: Upload URL created for the next document version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fp360DocumentUploadUrlResponse" }
        "401":
          description: Authentication required
  /redfp360/documents/{documentId}/versions/{versionId}/complete:
    post:
      operationId: completeFp360DocumentUpload
      tags: [redfp360]
      summary: Verify an uploaded file and finalize its version metadata
      parameters:
        - in: path
          name: documentId
          required: true
          schema: { type: string, minLength: 1 }
        - in: path
          name: versionId
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Verified document version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fp360DocumentVersion" }
        "401":
          description: Authentication required
  /redfp360/documents/{documentId}/versions/{versionId}:
    delete:
      operationId: abandonFp360DocumentUpload
      tags: [redfp360]
      summary: Abandon an incomplete upload without deleting document history
      parameters:
        - in: path
          name: documentId
          required: true
          schema: { type: string, minLength: 1 }
        - in: path
          name: versionId
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Pending upload abandoned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fp360DocumentDeleteResponse" }
        "401":
          description: Authentication required
  /redfp360/documents/{documentId}/versions/{versionId}/download:
    get:
      operationId: downloadFp360DocumentVersion
      tags: [redfp360]
      summary: Download a document version through an access-controlled short-lived URL
      parameters:
        - in: path
          name: documentId
          required: true
          schema: { type: string, minLength: 1 }
        - in: path
          name: versionId
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "302":
          description: Redirect to a short-lived private download URL
        "401":
          description: Authentication required
  /redfp360/documents/{documentId}/actions:
    post:
      operationId: actOnFp360Document
      tags: [redfp360]
      summary: Submit, review, confirm, finalize, void, or restore a document version
      parameters:
        - in: path
          name: documentId
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Fp360DocumentActionInput" }
      responses:
        "200":
          description: Updated document record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fp360Document" }
        "401":
          description: Authentication required
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: redfp360_session
  schemas:
    Fp360OrganizationInput:
      type: object
      required: [name, center, island, role]
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        center: { type: string, minLength: 1, maxLength: 150 }
        island: { type: string, enum: [Tenerife, Gran Canaria, Lanzarote, Fuerteventura, La Palma, La Gomera, El Hierro, La Graciosa] }
        role: { type: string, enum: [seller, buyer, both] }
    Fp360OrganizationUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        center: { type: string, minLength: 1, maxLength: 150 }
        island: { type: string, enum: [Tenerife, Gran Canaria, Lanzarote, Fuerteventura, La Palma, La Gomera, El Hierro, La Graciosa] }
        role: { type: string, enum: [seller, buyer, both] }
        isActive: { type: boolean }
    Fp360ProductInput:
      type: object
      required: [sku, name, category, unitPriceCents, igicBasisPoints, stock]
      properties:
        sku: { type: string, minLength: 1, maxLength: 40, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$' }
        name: { type: string, minLength: 1, maxLength: 150 }
        description: { type: string, maxLength: 2000 }
        category: { type: string, minLength: 1, maxLength: 100 }
        itemType: { type: string, enum: [product, service] }
        unit: { type: string, minLength: 1, maxLength: 40 }
        tracksInventory: { type: boolean }
        unitPriceCents: { type: integer, minimum: 0, maximum: 100000000 }
        costCents: { type: integer, minimum: 0, maximum: 100000000 }
        igicBasisPoints: { type: integer, minimum: 0, maximum: 10000 }
        stock: { type: integer, minimum: 0, maximum: 1000000 }
        minimumStock: { type: integer, minimum: 0, maximum: 1000000 }
        maxDiscountBasisPoints: { type: integer, minimum: 0, maximum: 10000 }
        leadTimeDays: { type: integer, minimum: 0, maximum: 3650 }
        supplierOrganizationId: { type: ["string", "null"] }
    Fp360ProductUpdate:
      type: object
      properties:
        sku: { type: string, minLength: 1, maxLength: 40, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$' }
        name: { type: string, minLength: 1, maxLength: 150 }
        description: { type: string, maxLength: 2000 }
        category: { type: string, minLength: 1, maxLength: 100 }
        itemType: { type: string, enum: [product, service] }
        unit: { type: string, minLength: 1, maxLength: 40 }
        tracksInventory: { type: boolean }
        unitPriceCents: { type: integer, minimum: 0, maximum: 100000000 }
        costCents: { type: integer, minimum: 0, maximum: 100000000 }
        igicBasisPoints: { type: integer, minimum: 0, maximum: 10000 }
        minimumStock: { type: integer, minimum: 0, maximum: 1000000 }
        maxDiscountBasisPoints: { type: integer, minimum: 0, maximum: 10000 }
        leadTimeDays: { type: integer, minimum: 0, maximum: 3650 }
        supplierOrganizationId: { type: ["string", "null"] }
        priceChangeReason: { type: string, minLength: 5, maxLength: 500 }
        effectiveFrom: { type: string, format: date }
        isActive: { type: boolean }
        isPublished: { type: boolean }
    Fp360ProductPriceVersion:
      type: object
      required: [id, unitPriceCents, costCents, igicBasisPoints, maxDiscountBasisPoints, validFrom, reason, actorName, createdAt]
      properties:
        id: { type: string }
        unitPriceCents: { type: integer, minimum: 0 }
        costCents: { type: integer, minimum: 0 }
        igicBasisPoints: { type: integer, minimum: 0 }
        maxDiscountBasisPoints: { type: integer, minimum: 0 }
        validFrom: { type: string, format: date }
        reason: { type: string }
        actorName: { type: string }
        createdAt: { type: string, format: date-time }
    Fp360ProductDocumentUploadUrlInput:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        size: { type: integer, minimum: 1, maximum: 10485760 }
        contentType:
          type: string
          enum: [application/pdf, image/jpeg, image/png, image/webp]
        description: { type: string, maxLength: 500 }
    Fp360ProductDocumentUploadUrl:
      type: object
      required: [documentId, uploadURL]
      properties:
        documentId: { type: string }
        uploadURL: { type: string, format: uri }
    Fp360ProductDocument:
      type: object
      required: [id, originalName, contentType, sizeBytes, description, status, uploaderName, createdAt]
      properties:
        id: { type: string }
        originalName: { type: string }
        contentType: { type: string }
        sizeBytes: { type: integer, minimum: 1 }
        description: { type: string }
        status: { type: string, enum: [pending, ready] }
        uploaderName: { type: string }
        createdAt: { type: string, format: date-time }
    Fp360ProductDocumentDeleteResponse:
      type: object
      required: [deleted]
      properties:
        deleted: { type: boolean }
    Fp360StockAdjustmentInput:
      type: object
      required: [operationId, quantityDelta, reason]
      properties:
        operationId: { type: string, format: uuid }
        quantityDelta: { type: integer, minimum: -1000000, maximum: 1000000 }
        reason: { type: string, minLength: 5, maxLength: 500 }
    Fp360StockAdjustment:
      type: object
      required: [id, quantityDelta, stockBefore, stockAfter, reason, actorName, simulatedDate, createdAt]
      properties:
        id: { type: string }
        quantityDelta: { type: integer }
        stockBefore: { type: integer }
        stockAfter: { type: integer }
        reason: { type: string }
        actorName: { type: string }
        simulatedDate: { type: string, format: date }
        createdAt: { type: string, format: date-time }
    PurchaseUrgency:
      type: string
      enum: [low, normal, high, urgent]
    PurchaseRequestStatus:
      type: string
      enum: [draft, requested, pending_approval, approved, rejected, ordered, cancelled]
    PurchaseOrderStatus:
      type: string
      enum: [ordered, partial, received]
    PurchaseEventStatus:
      type: string
      enum: [draft, requested, pending_approval, approved, rejected, ordered, partial, received, cancelled, pending_review, conformed, blocked, correction_requested, rectified]
    PurchaseRequestInput:
      type: object
      required: [operationId, organizationId, department, urgency, deadline, budgetCapCents, purpose, requestedSupplierIds, lines]
      properties:
        operationId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        department: { type: string, minLength: 2, maxLength: 100 }
        urgency: { $ref: "#/components/schemas/PurchaseUrgency" }
        deadline: { type: ["string", "null"], format: date }
        budgetCapCents: { type: integer, minimum: 1, maximum: 100000000 }
        purpose: { type: string, minLength: 5, maxLength: 500 }
        requestedSupplierIds:
          type: array
          minItems: 2
          maxItems: 5
          items: { type: string, format: uuid }
        lines:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: "#/components/schemas/PurchaseRequestLineInput" }
    PurchaseRequestLineInput:
      type: object
      required: [productId, quantity, justification]
      properties:
        productId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 1000000 }
        justification: { type: string, minLength: 5, maxLength: 300 }
    PurchaseRequestLine:
      type: object
      required: [id, productId, sku, productName, quantity, justification]
      properties:
        id: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        sku: { type: string }
        productName: { type: string }
        quantity: { type: integer }
        justification: { type: string }
    PurchaseSupplier:
      type: object
      required: [id, name, island]
