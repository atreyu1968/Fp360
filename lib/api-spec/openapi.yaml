        quantityAccepted: { type: integer }
        quantityRejected: { type: integer }
        issueReason: { type: ["string", "null"] }
    PurchaseReceipt:
      type: object
      required: [id, orderId, orderNumber, supplierName, receiptReference, receivedDate, status, acceptedUnits, rejectedUnits, lines, createdAt]
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        orderNumber: { type: string }
        supplierName: { type: string }
        receiptReference: { type: string }
        receivedDate: { type: string, format: date }
        status: { type: string, enum: [partial, received] }
        acceptedUnits: { type: integer }
        rejectedUnits: { type: integer }
        lines:
          type: array
          items: { $ref: "#/components/schemas/PurchaseReceiptLine" }
        createdAt: { type: string, format: date-time }
