              $ref: "#/components/schemas/Fp360AccountingSourceDraftInput"
      responses:
        "201":
          description: Draft created from source document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fp360AccountingEntry"
        "409":
          description: Source has already been imported
  /redfp360/accounting/periods/{fiscalYear}/{period}/close:
    post:
      operationId: closeFp360AccountingPeriod
      tags: [redfp360]
      summary: Close a period after required checks pass
      parameters:
        - name: fiscalYear
          in: path
          required: true
          schema: { type: integer, minimum: 2000, maximum: 2100 }
        - name: period
          in: path
          required: true
          schema: { type: integer, minimum: 1, maximum: 12 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Fp360AccountingPeriodActionInput"
      responses:
        "200":
          description: Period closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fp360AccountingPeriod"
        "409":
          description: Draft entries or imbalance prevent closure
  /redfp360/accounting/periods/{fiscalYear}/{period}/reopen:
    post:
      operationId: reopenFp360AccountingPeriod
      tags: [redfp360]
      summary: Reopen a period with teacher or administrator authorization
      parameters:
        - name: fiscalYear
          in: path
          required: true
          schema: { type: integer, minimum: 2000, maximum: 2100 }
        - name: period
          in: path
          required: true
          schema: { type: integer, minimum: 1, maximum: 12 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Fp360AccountingPeriodActionInput"
      responses:
        "200":
          description: Period reopened with audit event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fp360AccountingPeriod"
        "403":
          description: Only a teacher or administrator can reopen a period
  /redfp360/bank/overview:
    get:
      operationId: getFp360BankOverview
      tags: [redfp360]
      summary: Get simulated bank accounts and operations for one organization
      parameters:
        - name: organizationId
          in: query
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Accounts, transfers, movements, financing and risk indicators
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fp360BankOverview" }
        "403":
          description: Organization is outside the actor's access
  /redfp360/bank/accounts:
    post:
      operationId: createFp360BankAccount
      tags: [redfp360]
      summary: Create a synthetic bank account and record its opening balance
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Fp360BankAccountInput" }
      responses:
        "200":
          description: Previously created synthetic account returned after an idempotent retry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fp360BankAccount" }
        "201":
          description: Synthetic account created with balanced opening movements
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fp360BankAccount" }
        "400":
          description: Invalid account or opening balance
  /redfp360/bank/transfers:
    post:
      operationId: createFp360BankTransfer
      tags: [redfp360]
      summary: Create a simulated transfer draft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Fp360BankTransferInput" }
      responses:
        "200":
          description: Previously created transfer returned after an idempotent retry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fp360BankTransfer" }
        "201":
          description: Transfer draft created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fp360BankTransfer" }
        "400":
          description: Invalid transfer details
        "409":
          description: Operation identifier was reused with different data
  /redfp360/bank/transfers/{id}/action:
    post:
      operationId: actOnFp360BankTransfer
      tags: [redfp360]
      summary: Validate, authorize, execute, reject, or cancel a transfer
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Fp360BankTransferActionInput" }
      responses:
        "200":
          description: Transfer state updated with an audit event
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fp360BankTransfer" }
        "404":
          description: Transfer not found in the actor's organization
        "409":
          description: Transfer validation, available balance, or state transition failed
  /redfp360/bank/effects:
    post:
      operationId: createFp360BankEffect
      tags: [redfp360]
      summary: Present a simulated bill of exchange backed by an open invoice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Fp360BankEffectInput" }
      responses:
        "200":
          description: Previously presented effect returned after an idempotent retry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fp360BankEffect" }
        "201":
          description: Effect presented and linked to its source invoice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fp360BankEffect" }
        "400":
          description: Source invoice is not eligible for an effect
        "409":
          description: Operation identifier was reused with different data
  /redfp360/bank/financing:
    post:
      operationId: createFp360BankFinancing
      tags: [redfp360]
      summary: Request a simulated loan, credit line, or effect discount
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Fp360BankFinancingInput" }
      responses:
        "200":
          description: Previously created financing request returned after an idempotent retry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fp360BankFinancing" }
        "201":
          description: Financing request saved for review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fp360BankFinancing" }
        "400":
          description: Invalid request or ineligible effect
        "409":
          description: Operation identifier was reused with different data
  /redfp360/bank/financing/{id}/action:
    post:
      operationId: actOnFp360BankFinancing
      tags: [redfp360]
      summary: Offer, reject, accept, draw, repay, pay, or close financing
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Fp360BankFinancingActionInput" }
      responses:
        "200":
          description: Financing state, ledger movements, or repayment schedule updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fp360BankFinancing" }
        "404":
          description: Financing request not found in the actor's organization
        "409":
          description: Financing state or repayment conditions are not valid
  /redfp360/invoices/{id}/payments:
    post:
      operationId: recordFp360Payment
      tags: [redfp360]
      summary: Record a simulated bank payment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Fp360PaymentInput"
      responses:
        "201":
          description: Simulated payment recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fp360Invoice"
        "400":
          description: Invalid payment amount
        "404":
          description: Invoice not found
  /redfp360/activity:
    get:
      operationId: listFp360Activity
      tags: [redfp360]
      summary: List recent simulated business activity
      responses:
        "200":
          description: Chronological audit activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Fp360Activity"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: redfp360_session
  schemas:
    Fp360OrganizationInput:
      type: object
      required: [name, center, island, role]
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        center: { type: string, minLength: 1, maxLength: 150 }
        island: { type: string, enum: [Tenerife, Gran Canaria, Lanzarote, Fuerteventura, La Palma, La Gomera, El Hierro, La Graciosa] }
        role: { type: string, enum: [seller, buyer, both] }
    Fp360OrganizationUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        center: { type: string, minLength: 1, maxLength: 150 }
        island: { type: string, enum: [Tenerife, Gran Canaria, Lanzarote, Fuerteventura, La Palma, La Gomera, El Hierro, La Graciosa] }
        role: { type: string, enum: [seller, buyer, both] }
        isActive: { type: boolean }
    Fp360ProductInput:
      type: object
      required: [sku, name, category, unitPriceCents, igicBasisPoints, stock]
      properties:
        sku: { type: string, minLength: 1, maxLength: 40, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$' }
        name: { type: string, minLength: 1, maxLength: 150 }
        description: { type: string, maxLength: 2000 }
        category: { type: string, minLength: 1, maxLength: 100 }
        itemType: { type: string, enum: [product, service] }
        unit: { type: string, minLength: 1, maxLength: 40 }
        tracksInventory: { type: boolean }
        unitPriceCents: { type: integer, minimum: 0, maximum: 100000000 }
        costCents: { type: integer, minimum: 0, maximum: 100000000 }
        igicBasisPoints: { type: integer, minimum: 0, maximum: 10000 }
        stock: { type: integer, minimum: 0, maximum: 1000000 }
        minimumStock: { type: integer, minimum: 0, maximum: 1000000 }
        maxDiscountBasisPoints: { type: integer, minimum: 0, maximum: 10000 }
        leadTimeDays: { type: integer, minimum: 0, maximum: 3650 }
        supplierOrganizationId: { type: ["string", "null"] }
    Fp360ProductUpdate:
      type: object
      properties:
        sku: { type: string, minLength: 1, maxLength: 40, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$' }
        name: { type: string, minLength: 1, maxLength: 150 }
        description: { type: string, maxLength: 2000 }
        category: { type: string, minLength: 1, maxLength: 100 }
        itemType: { type: string, enum: [product, service] }
        unit: { type: string, minLength: 1, maxLength: 40 }
        tracksInventory: { type: boolean }
        unitPriceCents: { type: integer, minimum: 0, maximum: 100000000 }
        costCents: { type: integer, minimum: 0, maximum: 100000000 }
        igicBasisPoints: { type: integer, minimum: 0, maximum: 10000 }
        minimumStock: { type: integer, minimum: 0, maximum: 1000000 }
        maxDiscountBasisPoints: { type: integer, minimum: 0, maximum: 10000 }
        leadTimeDays: { type: integer, minimum: 0, maximum: 3650 }
        supplierOrganizationId: { type: ["string", "null"] }
        priceChangeReason: { type: string, minLength: 5, maxLength: 500 }
        effectiveFrom: { type: string, format: date }
        isActive: { type: boolean }
        isPublished: { type: boolean }
    Fp360ProductPriceVersion:
      type: object
      required: [id, unitPriceCents, costCents, igicBasisPoints, maxDiscountBasisPoints, validFrom, reason, actorName, createdAt]
      properties:
        id: { type: string }
        unitPriceCents: { type: integer, minimum: 0 }
        costCents: { type: integer, minimum: 0 }
        igicBasisPoints: { type: integer, minimum: 0 }
        maxDiscountBasisPoints: { type: integer, minimum: 0 }
        validFrom: { type: string, format: date }
        reason: { type: string }
        actorName: { type: string }
        createdAt: { type: string, format: date-time }
    Fp360ProductDocumentUploadUrlInput:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        size: { type: integer, minimum: 1, maximum: 10485760 }
        contentType:
          type: string
          enum: [application/pdf, image/jpeg, image/png, image/webp]
        description: { type: string, maxLength: 500 }
    Fp360ProductDocumentUploadUrl:
      type: object
      required: [documentId, uploadURL]
      properties:
        documentId: { type: string }
        uploadURL: { type: string, format: uri }
    Fp360ProductDocument:
      type: object
      required: [id, originalName, contentType, sizeBytes, description, status, uploaderName, createdAt]
      properties:
        id: { type: string }
        originalName: { type: string }
        contentType: { type: string }
        sizeBytes: { type: integer, minimum: 1 }
        description: { type: string }
        status: { type: string, enum: [pending, ready] }
        uploaderName: { type: string }
        createdAt: { type: string, format: date-time }
    Fp360ProductDocumentDeleteResponse:
      type: object
      required: [deleted]
      properties:
        deleted: { type: boolean }
    Fp360StockAdjustmentInput:
      type: object
      required: [operationId, quantityDelta, reason]
      properties:
        operationId: { type: string, format: uuid }
        quantityDelta: { type: integer, minimum: -1000000, maximum: 1000000 }
        reason: { type: string, minLength: 5, maxLength: 500 }
    Fp360StockAdjustment:
      type: object
      required: [id, quantityDelta, stockBefore, stockAfter, reason, actorName, simulatedDate, createdAt]
      properties:
        id: { type: string }
        quantityDelta: { type: integer }
        stockBefore: { type: integer }
        stockAfter: { type: integer }
        reason: { type: string }
        actorName: { type: string }
        simulatedDate: { type: string, format: date }
        createdAt: { type: string, format: date-time }
    PurchaseUrgency:
      type: string
      enum: [low, normal, high, urgent]
    PurchaseRequestStatus:
      type: string
      enum: [draft, requested, pending_approval, approved, rejected, ordered, cancelled]
    PurchaseOrderStatus:
      type: string
      enum: [ordered, partial, received]
    PurchaseEventStatus:
      type: string
      enum: [draft, requested, pending_approval, approved, rejected, ordered, partial, received, cancelled, pending_review, conformed, blocked, correction_requested, rectified]
    PurchaseRequestInput:
      type: object
      required: [operationId, organizationId, department, urgency, deadline, budgetCapCents, purpose, requestedSupplierIds, lines]
      properties:
        operationId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        department: { type: string, minLength: 2, maxLength: 100 }
        urgency: { $ref: "#/components/schemas/PurchaseUrgency" }
        deadline: { type: ["string", "null"], format: date }
        budgetCapCents: { type: integer, minimum: 1, maximum: 100000000 }
        purpose: { type: string, minLength: 5, maxLength: 500 }
        requestedSupplierIds:
          type: array
          minItems: 2
          maxItems: 5
          items: { type: string, format: uuid }
        lines:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: "#/components/schemas/PurchaseRequestLineInput" }
    PurchaseRequestLineInput:
      type: object
      required: [productId, quantity, justification]
      properties:
        productId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 1000000 }
        justification: { type: string, minLength: 5, maxLength: 300 }
    PurchaseRequestLine:
      type: object
      required: [id, productId, sku, productName, quantity, justification]
      properties:
        id: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        sku: { type: string }
        productName: { type: string }
        quantity: { type: integer }
        justification: { type: string }
    PurchaseSupplier:
      type: object
      required: [id, name, island]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        island: { type: string }
    PurchaseRequestSummary:
      type: object
      required: [id, requestNumber, organizationId, organizationName, department, urgency, deadline, budgetCapCents, status, lineCount, offerCount, updatedAt]
      properties:
        id: { type: string, format: uuid }
        requestNumber: { type: string }
        organizationId: { type: string, format: uuid }
        organizationName: { type: string }
        department: { type: string }
        urgency: { $ref: "#/components/schemas/PurchaseUrgency" }
        deadline: { type: ["string", "null"], format: date }
        budgetCapCents: { type: integer }
        status: { $ref: "#/components/schemas/PurchaseRequestStatus" }
        lineCount: { type: integer }
        offerCount: { type: integer }
        updatedAt: { type: string, format: date-time }
    PurchaseRequest:
      type: object
      required: [id, requestNumber, organizationId, organizationName, department, urgency, deadline, budgetCapCents, purpose, status, lineCount, offerCount, requestedSuppliers, lines, createdByRole, decisionReason, awardedReason, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        requestNumber: { type: string }
        organizationId: { type: string, format: uuid }
        organizationName: { type: string }
        department: { type: string }
        urgency: { $ref: "#/components/schemas/PurchaseUrgency" }
        deadline: { type: ["string", "null"], format: date }
        budgetCapCents: { type: integer }
        purpose: { type: string }
        status: { $ref: "#/components/schemas/PurchaseRequestStatus" }
        lineCount: { type: integer }
        offerCount: { type: integer }
        requestedSuppliers:
          type: array
          items: { $ref: "#/components/schemas/PurchaseSupplier" }
        lines:
          type: array
          items: { $ref: "#/components/schemas/PurchaseRequestLine" }
        createdByRole: { type: string }
        decisionReason: { type: ["string", "null"] }
        awardedReason: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PurchaseRequestTransitionInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 5, maxLength: 500 }
    PurchaseDecisionInput:
      type: object
      required: [decision, reason]
      properties:
        decision: { type: string, enum: [approved, rejected] }
        reason: { type: string, minLength: 5, maxLength: 500 }
    PurchaseAwardInput:
      type: object
      required: [offerId, reason]
      properties:
        offerId: { type: string, format: uuid }
        reason: { type: string, minLength: 5, maxLength: 500 }
    PurchaseOfferInput:
      type: object
